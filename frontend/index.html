<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnterpriseDocEngine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23059669'/><path d='M10 8h8l6 6v10a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z' fill='%23047857'/><path d='M18 8v6h6' fill='%23065f46'/><path d='M16 13l-3 5h3l-1 5 5-6h-3l2-4h-3z' fill='%23ffffff'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121214; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-[#121214] text-zinc-200 font-sans antialiased min-h-screen flex flex-col items-center p-4 md:p-6">

    <!-- Top Navigation -->
    <header class="w-full max-w-6xl flex justify-between items-center py-4 mb-6 border-b border-zinc-800">
        <div class="flex items-center space-x-3">
            <div class="h-9 w-9 bg-emerald-600 rounded-lg flex items-center justify-center font-bold text-white text-sm shadow-md shadow-emerald-900/30">
                ED
            </div>
            <div>
                <h1 class="text-base font-semibold text-zinc-100 tracking-tight">EnterpriseDocEngine</h1>
                <p class="text-[11px] text-zinc-500 font-mono">pgvector &bull; FastMCP &bull; LangGraph &bull; CrewAI</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-zinc-900/80 border border-zinc-800 px-3 py-1 rounded-full text-xs text-emerald-400 font-mono">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Cluster Live</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
        
        <!-- Left Sidebar: Controls & Ingestion -->
        <aside class="md:col-span-4 space-y-5">
            
            <!-- Engine Selection Card -->
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                <h2 class="text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-3">Intelligence Engine</h2>
                <div class="space-y-2.5">
                    <label class="flex items-start p-3 rounded-lg border border-zinc-800 bg-[#121214] hover:border-zinc-700 cursor-pointer transition">
                        <input type="radio" name="engineMode" value="langgraph" checked class="mt-1 accent-emerald-500">
                        <div class="ml-3">
                            <span class="block text-xs font-medium text-zinc-100">LangGraph State Machine</span>
                            <span class="block text-[11px] text-zinc-400">Deterministic hybrid vector retrieval</span>
                        </div>
                    </label>

                    <label class="flex items-start p-3 rounded-lg border border-zinc-800 bg-[#121214] hover:border-zinc-700 cursor-pointer transition">
                        <input type="radio" name="engineMode" value="crewai" class="mt-1 accent-emerald-500">
                        <div class="ml-3">
                            <span class="block text-xs font-medium text-zinc-100">CrewAI Multi-Agent Team</span>
                            <span class="block text-[11px] text-zinc-400">Autonomous synthesis & trace execution</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Ingestion Card -->
            <div class="bg-[#18181b] border border-zinc-800/80 rounded-xl p-4 shadow-sm">
                <h2 class="text-[11px] font-mono uppercase tracking-wider text-zinc-400 mb-3">Ingest Knowledge</h2>
                <div class="space-y-3">
                    <input type="file" id="docUploadInput" accept=".pdf,.txt" class="block w-full text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-medium file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700 cursor-pointer border border-zinc-800 rounded-lg p-1 bg-[#121214]">
                    
                    <button id="uploadBtn" onclick="handleDocumentUpload()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded-lg text-xs transition shadow-sm shadow-emerald-900/20 flex items-center justify-center space-x-2">
                        <span>Embed & Store Chunks</span>
                    </button>
                    <p id="uploadStatusMsg" class="text-[11px] font-mono"></p>
                </div>
            </div>

        </aside>

        <!-- Right: Execution Console -->
        <section class="md:col-span-8 bg-[#18181b] border border-zinc-800/80 rounded-xl flex flex-col h-[630px] overflow-hidden shadow-sm">
            
            <div class="px-4 py-2.5 border-b border-zinc-800 flex justify-between items-center bg-[#141416]">
                <span class="text-[11px] font-mono uppercase tracking-wider text-zinc-400">Execution Stream</span>
                <span id="activeModeBadge" class="text-[10px] font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-2.5 py-0.5 rounded">Engine: LangGraph</span>
            </div>

            <!-- Message Stream Area -->
            <div id="chatStream" class="flex-1 overflow-y-auto p-4 space-y-3 text-xs bg-[#121214]/60">
                <div class="text-zinc-500 text-[11px] italic bg-[#141416] p-3 rounded-lg border border-zinc-800/60">
                    Query internal vector knowledge. Execution steps will render with multi-agent pipeline traces.
                </div>
            </div>

            <!-- Query Input Bar -->
            <div class="p-3 border-t border-zinc-800 bg-[#141416]">
                <form onsubmit="handleQuerySubmit(event)" class="flex gap-2">
                    <input type="text" id="queryInput" placeholder="Ask about architecture, syllabus, or summaries..." class="flex-1 bg-[#121214] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition">
                    <button type="submit" id="submitBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-xs transition shadow-sm shadow-emerald-900/20 flex items-center justify-center">
                        Run
                    </button>
                </form>
            </div>

        </section>

    </main>

    
    <script>
        const API_BASE = "http://localhost:8000";
        document.querySelectorAll("input[name='engineMode']").forEach(radio => {
            radio.addEventListener("change", (e) => {
                const modeName = e.target.value === "langgraph" ? "LangGraph" : "CrewAI Multi-Agent";
                document.getElementById("activeModeBadge").innerText = `Engine: ${modeName}`;
            });
        });

        async function handleDocumentUpload() {
            const fileInput = document.getElementById("docUploadInput");
            const statusMsg = document.getElementById("uploadStatusMsg");
            const uploadBtn = document.getElementById("uploadBtn");
            if (!fileInput.files.length) {
                statusMsg.className = "text-[11px] text-amber-400";
                statusMsg.innerText = "Please select a file first.";
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            uploadBtn.disabled = true;
            uploadBtn.classList.add("opacity-50");
            statusMsg.className = "text-[11px] text-emerald-400";
            statusMsg.innerText = "Indexing chunks...";

            try {
                const res = await fetch(`${API_BASE}/documents/upload`, { method: "POST", body: formData });
                const data = await res.json();
                if (res.ok) {
                    statusMsg.className = "text-[11px] text-emerald-400";
                    statusMsg.innerText = `Uploaded ${data.chunks_created} chunks.`;
                    fileInput.value = "";
                } else {
                    throw new Error(data.detail || "Upload failed");
                }
            } catch (err) {
                statusMsg.className = "text-[11px] text-rose-400";
                statusMsg.innerText = `Error: ${err.message}`;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove("opacity-50");
            }
        }

        async function handleQuerySubmit(e) {
            e.preventDefault();
            const input = document.getElementById("queryInput");
            const query = input.value.trim();
            if (!query) return;

            const mode = document.querySelector("input[name='engineMode']:checked").value;
            const chatStream = document.getElementById("chatStream");
            const submitBtn = document.getElementById("submitBtn");

            const userBubble = document.createElement("div");
            userBubble.className = "flex justify-end";
            userBubble.innerHTML = `<div class="bg-emerald-600 text-white rounded-lg px-3 py-2 max-w-[80%] shadow-sm">${query}</div>`;
            chatStream.appendChild(userBubble);
            input.value = "";
            chatStream.scrollTop = chatStream.scrollHeight;

            submitBtn.disabled = true;
            const loadingBubble = document.createElement("div");
            loadingBubble.className = "flex justify-start";
            loadingBubble.innerHTML = `<div class="bg-[#141416] border border-zinc-800 text-zinc-400 rounded-lg px-3 py-2 text-xs font-mono flex items-center space-x-2">
                <span class="animate-spin text-emerald-400">&#9696;</span>
                <span>Agents analyzing knowledge base...</span>
            </div>`;
            chatStream.appendChild(loadingBubble);
            chatStream.scrollTop = chatStream.scrollHeight;

            try {
                const endpoint = mode === "langgraph" ? "/agent/chat" : "/crew/analyze";
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                chatStream.removeChild(loadingBubble);

                const botBubble = document.createElement("div");
                botBubble.className = "flex flex-col space-y-2 max-w-[95%]";

                if (mode === "crewai" && data.trace) {
                    let traceRows = data.trace.pipeline.map(step => `
                        <div class="border-b border-zinc-800 pb-1.5 last:border-b-0">
                            <span class="text-emerald-400 font-medium font-mono">${step.agent}</span>: 
                            <span class="text-zinc-300 font-mono text-[11px]">${step.action}</span>
                        </div>
                    `).join("");

                    botBubble.innerHTML += `
                        <div class="bg-[#141416] border border-zinc-800 rounded-lg p-2.5 text-[11px]">
                            <div class="text-zinc-400 font-mono mb-1.5 text-[10px] uppercase tracking-wider font-semibold">Multi-Agent Trace (${data.trace.framework})</div>
                            <div class="space-y-1">${traceRows}</div>
                        </div>
                    `;
                }

                const answerContent = mode === "langgraph" ? data.response : data.analysis;
                botBubble.innerHTML += `<div class="bg-[#141416] border border-zinc-800 rounded-lg p-3 text-zinc-200 markdown-body leading-relaxed">${marked.parse(answerContent)}</div>`;
                chatStream.appendChild(botBubble);
            } catch (err) {
                if (loadingBubble.parentNode) chatStream.removeChild(loadingBubble);
                const errBubble = document.createElement("div");
                errBubble.className = "text-xs text-rose-400 bg-rose-950/20 border border-rose-900/40 p-2.5 rounded-lg";
                errBubble.innerText = `Request Failed: ${err.message}`;
                chatStream.appendChild(errBubble);
            } finally {
                submitBtn.disabled = false;
                chatStream.scrollTop = chatStream.scrollHeight;
            }
        }
    </script>
</body>
</html>
