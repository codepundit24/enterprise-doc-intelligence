<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Doc Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto py-10 px-4">
    <header class="mb-10 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Enterprise Document Intelligence</h1>
      <p class="text-slate-400">PostgreSQL + pgvector Semantic Search & Document Ingestion Engine</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Upload Card -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-semibold text-sky-400 mb-4">1. Ingest Document (PDF / TXT)</h2>
        <form id="uploadForm" class="space-y-4">
          <input type="file" id="docFile" accept=".pdf,.txt" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-500 cursor-pointer" required />
          <button type="submit" id="uploadBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 rounded-md transition duration-200">Upload & Vectorize</button>
        </form>
        <div id="uploadStatus" class="mt-4 text-sm hidden"></div>
      </div>

      <!-- Search Card -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-semibold text-emerald-400 mb-4">2. Semantic Search Query</h2>
        <form id="searchForm" class="space-y-4">
          <input type="text" id="queryInput" placeholder="Ask a question or enter topic..." class="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" required />
          <div class="flex space-x-4">
            <input type="number" id="topKInput" min="1" max="10" value="3" class="w-24 bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-sm text-white text-center" />
            <button type="submit" id="searchBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-md transition duration-200">Search Engine</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Results Section -->
    <div class="mt-10">
      <h3 class="text-xl font-semibold text-slate-200 mb-4">Retrieved Context & Chunks</h3>
      <div id="resultsContainer" class="space-y-4">
        <p class="text-sm text-slate-500 italic">No search executed yet.</p>
      </div>
    </div>
  </div>

  <script>
    const uploadForm = document.getElementById('uploadForm');
    const uploadStatus = document.getElementById('uploadStatus');
    const searchForm = document.getElementById('searchForm');
    const resultsContainer = document.getElementById('resultsContainer');

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('docFile');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      uploadStatus.className = 'mt-4 text-sm text-amber-400 block';
      uploadStatus.innerText = 'Extracting text & generating vectors...';

      try {
        const res = await fetch('/documents/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          uploadStatus.className = 'mt-4 text-sm text-emerald-400 block';
          uploadStatus.innerText = `Success: ${data.filename} indexed into ${data.chunks_created} vector chunks!`;
          uploadForm.reset();
        } else {
          uploadStatus.className = 'mt-4 text-sm text-rose-400 block';
          uploadStatus.innerText = data.detail || 'Upload failed.';
        }
      } catch (err) {
        uploadStatus.className = 'mt-4 text-sm text-rose-400 block';
        uploadStatus.innerText = 'Server connection error.';
      }
    });

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('queryInput').value;
      const top_k = parseInt(document.getElementById('topKInput').value, 10);

      resultsContainer.innerHTML = '<p class="text-sm text-slate-400">Executing pgvector cosine search...</p>';

      try {
        const res = await fetch('/documents/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, top_k })
        });
        const data = await res.json();
        
        if (res.ok && data.results.length > 0) {
          resultsContainer.innerHTML = data.results.map(r => `
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg">
              <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-mono bg-sky-950 text-sky-300 px-2 py-0.5 rounded border border-sky-800">${r.filename} (Chunk #${r.chunk_id})</span>
                <span class="text-xs font-semibold text-emerald-400">Score: ${(r.similarity_score * 100).toFixed(1)}% match</span>
              </div>
              <p class="text-sm text-slate-300 leading-relaxed whitespace-pre-line">${r.content}</p>
            </div>
          `).join('');
        } else {
          resultsContainer.innerHTML = '<p class="text-sm text-slate-400">No matching documents found.</p>';
        }
      } catch (err) {
        resultsContainer.innerHTML = '<p class="text-sm text-rose-400">Search execution failed.</p>';
      }
    });
  </script>
</body>
</html>
